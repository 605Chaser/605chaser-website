<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>605 Chaser 7-Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<!--
  605 CHASER — 7-DAY FORECAST BROWSER SOURCE
  Live data: api.weather.gov (National Weather Service). Icons are picked from each
  NWS forecast period's icon codes, so they always match the actual forecast.

  STREAMLABS
    Horizontal: Browser Source, width 1920, height 1080
    Vertical:   Browser Source, width 1080, height 1920  (add ?layout=v)
    Tip: tick "Refresh browser when scene becomes active" so the intro plays each time.

  URL OPTIONS (all optional; anything left out uses DEFAULTS below)
    lat, lon      location (any US point)               ?lat=43.5446&lon=-96.7311
    name          location label shown on screen         &name=Sioux%20Falls,%20SD
    layout        h (1920x1080) | v (1080x1920)
    bg            solid (full branded backdrop) | clear (panels only, transparent)
    safe          1 = keep vertical layout inside TikTok/Reels UI safe zone, 0 = full canvas
    units         us | si
    alerts        1 = show active NWS alerts in footer, 0 = off
    refresh       minutes between data refreshes (default 30)
    replay        seconds between intro replays, 0 = play once
    icons         video (rendered After Effects loops in the icons/ folder, default) | photo (built-in photo layers) | flat (simple 605 vector icons)
    videodir      folder holding the rendered loops (default icons/, next to this file)
    tonight       show | skip  (whether a leading "Tonight" card is kept in evening forecasts)
    title         header title text
    iconpack      folder/URL of your own animated icons, e.g. icons/   (see ICON KEYS)
    iconext       webm | mp4 | gif | png | svg  (file extension of your icon pack)
    setup=1       opens the setup panel (location search, live preview, URL builder,
                  and Export: save a full-size PNG or record a short video of the graphic)
    gallery=1     shows every animated icon for checking
    demo=1        sample data (for designing when offline; never use on air)

  ICON KEYS (file names for a custom icon pack, e.g. icons/thunderstorms.webm)
    clear-day clear-night partly-cloudy-day partly-cloudy-night mostly-cloudy-day
    mostly-cloudy-night cloudy windy rain showers-day showers-night thunderstorms
    scattered-tstorms-day scattered-tstorms-night tornado snow rain-snow sleet
    freezing-rain blizzard fog haze smoke dust hot cold tropical
-->
<style>
:root{
  --charcoal:#141414; --gold:#E8B723; --amber:#FFB703; --cream:#F5F1E8; --steel:#9DAAB8;
  --ink:#0d0d0d; --line:rgba(157,170,184,.18); --card:linear-gradient(180deg,rgba(245,241,232,.07),rgba(245,241,232,.025));
  --band:rgba(245,241,232,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;overflow:hidden;color:var(--cream);font-family:Oswald,"Arial Narrow",Arial,sans-serif}
body.setup{background:#0b0b0b}
#viewport{position:absolute;left:0;top:0;right:0;bottom:0;overflow:hidden}
body.setup #viewport{right:420px;background:
  repeating-conic-gradient(#1a1a1a 0% 25%,#222 0% 50%) 0 0/32px 32px}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden}
.v #stage{width:1080px;height:1920px}
.clear #stage{--card:rgba(20,20,20,.9);--band:rgba(245,241,232,.05)}

/* ---------- backdrop ---------- */
.bg{position:absolute;inset:0;background:
  radial-gradient(1100px 700px at 15% 0%,#262219 0%,transparent 60%),
  radial-gradient(1000px 700px at 100% 100%,#1c1e22 0%,transparent 60%),var(--charcoal);overflow:hidden}
.bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.28;animation:blob 26s ease-in-out infinite alternate}
.bg i:nth-child(1){width:700px;height:420px;left:-120px;top:120px;background:#3a3427}
.bg i:nth-child(2){width:800px;height:500px;right:-200px;top:-140px;background:#2a2f36;animation-duration:32s}
.bg i:nth-child(3){width:600px;height:380px;left:40%;bottom:-160px;background:#2d2a22;animation-duration:38s}
@keyframes blob{to{transform:translate(120px,-40px) scale(1.15)}}
.bg b{position:absolute;height:6px;width:900px;transform:rotate(-32deg);transform-origin:left;opacity:.9}
.bg b:nth-of-type(1){background:var(--gold);left:-260px;top:300px}
.bg b:nth-of-type(2){background:var(--amber);left:-260px;top:336px;height:3px;opacity:.6}
.bg b:nth-of-type(3){background:var(--gold);right:-640px;bottom:-60px;left:auto;opacity:.5;height:3px}
.v .bg b:nth-of-type(1){top:200px}.v .bg b:nth-of-type(2){top:236px}

/* ---------- intro wipe ---------- */
.wipe{position:absolute;inset:-20%;pointer-events:none;z-index:50}
.wipe s{position:absolute;top:0;bottom:0;width:60%;left:-80%;transform:skewX(-22deg)}
.wipe s:nth-child(1){background:var(--gold)}
.wipe s:nth-child(2){background:var(--amber);width:20%}
.wipe s:nth-child(3){background:var(--charcoal);width:35%}
.play .wipe s{animation:wipe 1.15s cubic-bezier(.7,0,.25,1) both}
.play .wipe s:nth-child(2){animation-delay:.08s}
.play .wipe s:nth-child(3){animation-delay:.16s}
@keyframes wipe{0%{left:-80%}100%{left:180%}}

/* ---------- header ---------- */
.hdr{position:absolute;display:flex;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.clear .hdr{background:rgba(20,20,20,.92)}
.h .hdr{left:64px;right:64px;top:56px;height:150px}
.logo{background:var(--gold);color:var(--charcoal);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 34px;min-width:210px;position:relative}
.logo:after{content:"";position:absolute;right:-28px;top:0;bottom:0;width:56px;background:var(--gold);transform:skewX(-14deg);z-index:0}
.logo img{max-height:120px;max-width:200px;position:relative;z-index:1}
.logo .mark{height:132px;width:auto;margin:0 16px 0 -8px;position:relative;z-index:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.logo .wm{display:flex;flex-direction:column;align-items:center;position:relative;z-index:1}
.h .logo{flex-direction:row;padding:0 30px 0 22px}
.v .logo .mark{height:70px;margin:0 4px 0 -6px}
.v .logo .wm{flex-direction:row;align-items:baseline;gap:16px}
.logo .n{font-family:Anton,Impact,sans-serif;font-size:76px;line-height:.9;letter-spacing:1px;position:relative;z-index:1}
.logo .c{font-family:Oswald,sans-serif;font-weight:600;font-size:22px;letter-spacing:9px;margin-left:9px;position:relative;z-index:1}
.htxt{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 40px 0 64px;min-width:0}
.htitle{font-family:Anton,Impact,sans-serif;font-size:76px;line-height:1;text-transform:uppercase;letter-spacing:1px;white-space:nowrap}
.hloc{font-family:Oswald,sans-serif;font-weight:500;font-size:34px;color:var(--gold);text-transform:uppercase;letter-spacing:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hmeta{display:flex;flex-direction:column;justify-content:center;align-items:flex-end;padding:0 36px;font-family:"Space Mono",monospace;color:var(--steel);font-size:20px;line-height:1.5;text-align:right;white-space:nowrap}
.hmeta strong{color:var(--cream);font-weight:700}
.h .hrow{display:flex;align-items:baseline;gap:26px}
.play .hdr{animation:reveal .7s cubic-bezier(.2,.8,.2,1) .55s both}
@keyframes reveal{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}

/* ---------- day cards (horizontal) ---------- */
.days{position:absolute}
.h .days{left:64px;right:64px;top:236px;height:660px;display:grid;grid-template-columns:repeat(7,1fr);gap:18px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.play .card{animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.9s + var(--i)*.09s)}
@keyframes rise{from{opacity:0;transform:translateY(46px)}to{opacity:1;transform:none}}
.c-head{background:var(--band);border-bottom:3px solid var(--gold);padding:14px 10px 10px;text-align:center}
.today .c-head{background:var(--gold);color:var(--charcoal)}
.c-day{font-family:Anton,Impact,sans-serif;font-size:58px;line-height:1;letter-spacing:1px}
.c-date{font-family:"Space Mono",monospace;font-size:19px;color:var(--steel);letter-spacing:2px;margin-top:4px}
.today .c-date{color:#3b3216}
.c-icon{position:relative;height:256px;display:flex;align-items:center;justify-content:center}
.c-icon .wx,.c-icon .ext{width:262px;height:210px}
.badge{position:absolute;left:50%;bottom:-4px;transform:translateX(-50%);background:var(--amber);color:var(--charcoal);font-family:Oswald,sans-serif;font-weight:600;font-size:17px;letter-spacing:2px;padding:3px 10px;border-radius:4px;white-space:nowrap;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(255,183,3,.0),0 0 18px rgba(255,183,3,.55)}}
.severe{border-color:rgba(255,183,3,.7);box-shadow:inset 0 0 0 1px rgba(255,183,3,.35)}
.c-text{flex:1;padding:12px 16px 0;text-align:center;font-size:27px;line-height:1.18;font-weight:500;color:var(--cream);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;text-transform:uppercase;letter-spacing:.5px}
.c-temps{display:flex;justify-content:center;align-items:flex-end;gap:16px;padding:6px 8px 8px}
.t{font-family:Anton,Impact,sans-serif;line-height:.95;position:relative}
.t .lbl{display:block;font-family:"Space Mono",monospace;font-size:15px;letter-spacing:3px;color:var(--steel);text-align:center;margin-bottom:4px}
.t.hi{font-size:94px;color:var(--cream)}
.t.lo{font-size:56px;color:var(--steel);padding-bottom:6px}
.t sup{font-size:.45em;vertical-align:top;position:relative;top:.15em;color:var(--gold)}
.t.lo sup{color:var(--steel)}
.c-meta{display:flex;justify-content:space-between;align-items:center;background:var(--band);border-top:1px solid var(--line);padding:12px 16px;font-family:"Space Mono",monospace;font-size:21px;color:var(--cream)}
.m{display:flex;align-items:center;gap:7px;white-space:nowrap}
.m svg{flex:none}
.m.dry{color:var(--steel)}

/* ---------- footer ---------- */
.ftr{position:absolute;display:flex;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.clear .ftr{background:rgba(20,20,20,.92)}
.h .ftr{left:64px;right:64px;top:926px;height:92px}
.tag{display:flex;align-items:center;padding:0 30px;font-family:Anton,Impact,sans-serif;font-size:30px;letter-spacing:2px;color:var(--gold);white-space:nowrap}
.tag em{font-style:normal;color:var(--cream);margin-left:.35em}
.src{margin-left:auto;display:flex;align-items:center;padding:0 30px;font-family:"Space Mono",monospace;font-size:19px;color:var(--steel);white-space:nowrap}
.alrt{display:none;flex:1;min-width:0;align-items:center}
.has-alerts .alrt{display:flex}
.has-alerts .tag{display:none}
.alrt .lab{background:var(--amber);color:var(--charcoal);height:100%;display:flex;align-items:center;gap:10px;padding:0 24px;font-family:Anton,Impact,sans-serif;font-size:30px;letter-spacing:2px;white-space:nowrap;animation:apulse 1.4s ease-in-out infinite}
@keyframes apulse{50%{background:var(--gold)}}
.alrt .win{flex:1;overflow:hidden;position:relative;height:100%;display:flex;align-items:center;mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent)}
.alrt .run{white-space:nowrap;font-family:Oswald,sans-serif;font-weight:600;font-size:32px;text-transform:uppercase;letter-spacing:1px;padding-left:24px}
.alrt .run.scroll{animation:marq var(--dur,20s) linear infinite}
.alrt .run span{color:var(--amber)}
@keyframes marq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.play .ftr{animation:rise .6s cubic-bezier(.2,.8,.2,1) 1.6s both}

/* ---------- vertical layout ---------- */
.v .hdr{left:var(--vl);right:var(--vr);top:var(--vtop);height:var(--vhh);flex-direction:column}
.v .logo{flex-direction:row;gap:18px;justify-content:flex-start;padding:14px 30px;min-width:0}
.v .logo:after{display:none}
.v .logo .n{font-size:56px}
.v .logo .c{font-size:22px;letter-spacing:8px;margin:0}
.v .logo img{max-height:64px}
.v .htxt{padding:12px 30px 0}
.v .htitle{font-size:var(--vtitle)}
.v .hloc{font-size:32px}
.v .hmeta{flex-direction:row;justify-content:space-between;align-items:center;padding:6px 30px 14px;text-align:left;font-size:19px;gap:12px}
.v .days{left:var(--vl);right:var(--vr);top:var(--vdays);display:flex;flex-direction:column;gap:var(--vgap)}
.v .card{flex-direction:row;align-items:stretch;height:var(--vrow)}
.v .play .card,.play.v .card{animation-name:slide}
@keyframes slide{from{opacity:0;transform:translateX(-70px)}to{opacity:1;transform:none}}
.v .c-head{width:140px;flex:none;border-bottom:0;border-right:4px solid var(--gold);display:flex;flex-direction:column;justify-content:center;padding:6px}
.v .c-day{font-size:50px}
.v .c-date{font-size:17px;letter-spacing:1px}
.v .c-icon{width:150px;flex:none;height:auto}
.v .c-icon .wx,.v .c-icon .ext{width:150px;height:120px}
.v .badge{font-size:13px;padding:2px 6px;bottom:4px;letter-spacing:1px}
.v .c-mid{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:0 6px 0 4px}
.v .c-text{flex:none;padding:0;text-align:left;font-size:25px;-webkit-line-clamp:2}
.v .c-meta{background:none;border:0;padding:0;justify-content:flex-start;gap:22px;font-size:19px}
.v .c-temps{width:184px;flex:none;background:var(--band);border-left:1px solid var(--line);padding:0 10px;align-items:center;gap:12px}
.v .t.hi{font-size:66px}
.v .t.lo{font-size:42px;padding-bottom:0}
.v .t .lbl{font-size:13px;margin-bottom:2px}
.v .ftr{left:var(--vl);right:var(--vr);top:var(--vftr);height:84px}
.v .tag{font-size:25px;padding:0 22px}
.v .src{display:none}
.v .alrt .lab{font-size:24px;padding:0 16px}
.v .alrt .run{font-size:27px}

/* ---------- status ---------- */
.status{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:"Space Mono",monospace;font-size:26px;color:var(--steel);text-align:center;background:rgba(20,20,20,.85);padding:24px 36px;border-radius:12px;border:1px solid var(--line);display:none;z-index:40}
.status.on{display:block}

/* ---------- weather icons ---------- */
.wx{overflow:visible}
.wx .spin,.wx .spinf,.wx .glow,.wx .tw,.wx .funnel,.wx .debris,.wx .flake,.wx .bliz,.wx .pellet,.wx .heat{transform-box:fill-box}
.wx .spin{transform-origin:center;animation:spin 24s linear infinite}
.wx .spinf{transform-origin:center;animation:spin 5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.wx .glow{transform-origin:center;animation:glow 4s ease-in-out infinite}
@keyframes glow{50%{transform:scale(1.08);opacity:.35}}
.wx .bob{animation:bob 7s ease-in-out infinite}
.wx .bob2{animation:bob 9s ease-in-out infinite reverse}
@keyframes bob{50%{transform:translateX(7px)}}
.wx .drop{animation:drop 1.05s linear infinite}
@keyframes drop{0%{transform:translateY(-8px);opacity:0}20%{opacity:1}100%{transform:translateY(24px);opacity:0}}
.wx .flake{animation:flake 3.2s linear infinite}
@keyframes flake{0%{transform:translate(0,-10px) rotate(0);opacity:0}15%{opacity:1}50%{transform:translate(6px,10px) rotate(90deg)}100%{transform:translate(-4px,32px) rotate(180deg);opacity:0}}
.wx .bliz{animation:bliz 1.3s linear infinite}
@keyframes bliz{0%{transform:translate(-26px,-10px);opacity:0}20%{opacity:1}100%{transform:translate(30px,26px);opacity:0}}
.wx .pellet{animation:pellet 1s cubic-bezier(.55,0,1,.45) infinite}
@keyframes pellet{0%{transform:translateY(-8px);opacity:0}15%{opacity:1}75%{transform:translateY(22px)}88%{transform:translateY(16px)}100%{transform:translateY(22px);opacity:0}}
.wx .bolt{animation:flash 3.4s linear infinite}
@keyframes flash{0%,56%{opacity:.55}58%{opacity:1}62%{opacity:.2}65%{opacity:1}76%,100%{opacity:.55}}
.wx .stormcloud{animation:cflash 3.4s linear infinite}
@keyframes cflash{0%,56%{filter:brightness(1)}58%{filter:brightness(1.6)}62%{filter:brightness(1)}65%{filter:brightness(1.5)}76%,100%{filter:brightness(1)}}
.wx .gust{stroke-dasharray:90 260;animation:gust 2.6s ease-in-out infinite}
@keyframes gust{0%{stroke-dashoffset:120;opacity:0}25%{opacity:1}100%{stroke-dashoffset:-230;opacity:0}}
.wx .fogl{animation:fog 5s ease-in-out infinite alternate}
@keyframes fog{from{transform:translateX(-12px)}to{transform:translateX(12px)}}
.wx .tw{transform-origin:center;animation:tw 2.8s ease-in-out infinite}
@keyframes tw{50%{opacity:.15;transform:scale(.6)}}
.wx .funnel{transform-origin:top center;animation:sway 2.4s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-7deg) skewX(4deg)}to{transform:rotate(6deg) skewX(-5deg)}}
.wx .debris{animation:debris 1.6s linear infinite;transform-origin:center}
@keyframes debris{0%{transform:translate(0,0);opacity:0}30%{opacity:1}100%{transform:translate(18px,-22px);opacity:0}}
.wx .heat{animation:heat 2.4s ease-in-out infinite}
@keyframes heat{0%{transform:translateY(8px);opacity:0}40%{opacity:1}100%{transform:translateY(-14px);opacity:0}}
.wx .haze{animation:fog 6s ease-in-out infinite alternate}
.wx .ext{object-fit:contain}


/* ---------- photo icon set (from Animated Icons III layers) ---------- */
.pi{position:relative;overflow:visible}
.c-icon .pi{width:262px;height:210px;--k:.655}
.v .c-icon .pi{width:150px;height:120px;--k:.375}
.gal .pi{width:200px;height:160px;--k:.5}
.pst{position:absolute;left:0;top:0;width:400px;height:320px;transform:scale(var(--k));transform-origin:0 0}
.L{position:absolute;display:block;background-size:100% 100%;background-repeat:no-repeat}
.grp{left:0;top:0;width:400px;height:320px}
.spinS{animation:spin 70s linear infinite}
.pulse{animation:pulse2 4s ease-in-out infinite}
@keyframes pulse2{50%{transform:scale(1.05);filter:brightness(1.12)}}
.glowp{animation:glowp 5s ease-in-out infinite}
@keyframes glowp{50%{opacity:.7}}
.drift{animation:dr 9s ease-in-out infinite alternate}
.drift2{animation:dr 12s ease-in-out infinite alternate-reverse}
.driftF{animation:drf 2.6s ease-in-out infinite alternate}
@keyframes dr{from{transform:translateX(-9px)}to{transform:translateX(9px)}}
@keyframes drf{from{transform:translateX(-16px)}to{transform:translateX(16px)}}
.dim{filter:brightness(.72)}
.dark{filter:brightness(.6) contrast(1.1)}
.twA{animation:twk 2.6s ease-in-out infinite alternate}
.twB{animation:twk 3.4s ease-in-out infinite alternate-reverse}
@keyframes twk{from{opacity:1}to{opacity:.15}}
.boltA{opacity:0;animation:bfA 3.6s linear infinite}
.boltB{opacity:0;animation:bfB 3.6s linear infinite}
@keyframes bfA{0%,54%{opacity:0}55%{opacity:1}58%{opacity:.2}60%{opacity:1}66%,100%{opacity:0}}
@keyframes bfB{0%,80%{opacity:0}81%{opacity:1}84%{opacity:0}86%{opacity:.9}90%,100%{opacity:0}}
.cbflash{animation:cbf 3.6s linear infinite}
@keyframes cbf{0%,54%{filter:brightness(1)}55%{filter:brightness(1.55)}58%{filter:brightness(1.05)}60%{filter:brightness(1.45)}66%,80%{filter:brightness(1)}81%{filter:brightness(1.35)}84%,100%{filter:brightness(1)}}
.pw{overflow:hidden;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 18%,#000 62%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 18%,#000 62%,transparent 100%)}
.strip{position:absolute;left:0;top:0;right:0;bottom:0;background-repeat:repeat;animation:fall linear infinite}
@keyframes fall{from{background-position:var(--ox,0px) 0}to{background-position:var(--ox,0px) var(--tile)}}
.strip.a-rain{filter:drop-shadow(0 0 1.5px rgba(220,235,255,.9))}
.strip.a-rain.icy{filter:sepia(1) hue-rotate(160deg) saturate(3.2) brightness(1.15) drop-shadow(0 0 1.5px rgba(190,230,255,.9))}
.light{opacity:.8}
.icy{filter:sepia(1) hue-rotate(160deg) saturate(3.2) brightness(1.15)}
.fogA{animation:dr 11s ease-in-out infinite alternate;opacity:.85}
.fogB{animation:dr 8s ease-in-out infinite alternate-reverse;opacity:.9}
.fogC{animation:drf 7s ease-in-out infinite alternate;opacity:.8}
.tintH{filter:sepia(.85) saturate(1.5) brightness(.95)}
.tintS{filter:grayscale(1) brightness(.62)}
.tintD{filter:sepia(1) saturate(2.4) hue-rotate(-14deg) brightness(.82)}
.hotS{filter:hue-rotate(-22deg) saturate(1.5)}
.smokeS{filter:hue-rotate(-30deg) saturate(1.3) brightness(.85)}

.vbox{position:relative;display:flex;align-items:center;justify-content:center}
.c-icon .vbox{width:226px;height:250px}
.v .c-icon .vbox{width:150px;height:126px}
.gal .vbox{width:190px;height:170px}
.vid{max-width:100%;max-height:100%;width:auto;height:auto;display:block}
/* ---------- gallery ---------- */
.gal{position:absolute;inset:30px;display:grid;grid-template-columns:repeat(8,1fr);grid-auto-rows:1fr;gap:10px}
.gal>div{background:var(--card);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Space Mono",monospace;font-size:17px;color:var(--steel)}
.gal svg{width:200px;height:160px}
.v .gal{grid-template-columns:repeat(4,1fr)}

/* ---------- export ---------- */
body.exporting{background:#141414}
body.exporting #viewport{background:#141414}
body.freeze *{animation-play-state:paused!important}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#E8B723;color:#141414;font-family:Oswald,sans-serif;font-weight:600;font-size:18px;letter-spacing:1px;padding:10px 18px;border-radius:8px;z-index:200;display:none}
/* ---------- setup panel ---------- */
#panel{position:fixed;right:0;top:0;bottom:0;width:420px;background:#161616;border-left:1px solid #2a2a2a;padding:22px 22px 40px;overflow:auto;font-family:Oswald,sans-serif;display:none;z-index:100}
body.setup #panel{display:block}
#panel h2{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:30px;margin:0 0 4px;color:var(--gold);letter-spacing:1px}
#panel p.sub{margin:0 0 18px;color:var(--steel);font-size:15px}
#panel label{display:block;font-size:14px;letter-spacing:1.5px;text-transform:uppercase;color:var(--steel);margin:14px 0 6px}
#panel input,#panel select,#panel textarea{width:100%;background:#0f0f0f;border:1px solid #333;color:var(--cream);border-radius:8px;padding:10px 12px;font-size:16px;font-family:"Space Mono",monospace}
#panel input:focus,#panel select:focus{outline:2px solid var(--gold);border-color:transparent}
#panel .row{display:flex;gap:10px}
#panel .row>div{flex:1}
#panel button{background:var(--gold);color:var(--charcoal);border:0;border-radius:8px;padding:10px 16px;font-family:Oswald,sans-serif;font-weight:600;font-size:16px;letter-spacing:1px;cursor:pointer;text-transform:uppercase}
#panel button.ghost{background:transparent;color:var(--cream);border:1px solid #444}
#panel .btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
#results{margin-top:6px}
#results div{padding:8px 10px;border-radius:6px;cursor:pointer;font-size:15px;color:var(--cream)}
#results div:hover{background:#262626}
#url{height:120px;resize:vertical;font-size:13px}
#panel .note{font-size:14px;color:var(--steel);line-height:1.45;margin-top:10px}

<body>
<div id="viewport"><div id="stage"></div></div>

<aside id="panel">
  <h2>605 CHASER · 7-DAY SETUP</h2>
  <p class="sub">Choose a location and layout, check the preview, then copy the URL into a Streamlabs Browser Source.</p>
  <label>Find a location</label>
  <div class="row"><div><input id="q" placeholder="City or town, e.g. Huron"></div><button id="go" style="flex:none">Search</button></div>
  <div id="results"></div>
  <div class="row">
    <div><label>Latitude</label><input id="f-lat"></div>
    <div><label>Longitude</label><input id="f-lon"></div>
  </div>
  <label>On-screen location name</label><input id="f-name">
  <label>Header title</label><input id="f-title">
  <div class="row">
    <div><label>Layout</label><select id="f-layout"><option value="h">Horizontal 1920×1080</option><option value="v">Vertical 1080×1920</option></select></div>
    <div><label>Background</label><select id="f-bg"><option value="solid">Solid (full screen)</option><option value="clear">Clear (panels only)</option></select></div>
  </div>
  <div class="row">
    <div><label>Vertical safe zone</label><select id="f-safe"><option value="1">On (TikTok/Reels)</option><option value="0">Off</option></select></div>
    <div><label>Units</label><select id="f-units"><option value="us">°F / mph</option><option value="si">°C / km/h</option></select></div>
  </div>
  <div class="row">
    <div><label>NWS alerts</label><select id="f-alerts"><option value="1">Show</option><option value="0">Hide</option></select></div>
    <div><label>Leading "Tonight"</label><select id="f-tonight"><option value="show">Show</option><option value="skip">Skip</option></select></div>
  </div>
  <div class="row">
    <div><label>Refresh (min)</label><input id="f-refresh" type="number" min="5"></div>
    <div><label>Replay intro (sec)</label><input id="f-replay" type="number" min="0"></div>
  </div>
  <label>Icon style</label><select id="f-icons"><option value="video">After Effects renders (icons folder)</option><option value="photo">Animated photo icons (built-in)</option><option value="flat">Flat 605 icons</option></select>
  <label>Render folder</label><input id="f-videodir">
  <div class="row">
    <div><label>Icon pack folder</label><input id="f-iconpack" placeholder="(built-in)"></div>
    <div><label>Icon file type</label><select id="f-iconext"><option>webm</option><option>mp4</option><option>gif</option><option>png</option><option>svg</option></select></div>
  </div>
  <div class="btns"><button id="apply">Update preview</button><button class="ghost" id="replay">Replay intro</button><button class="ghost" id="gal">Icon gallery</button></div>
  <label>Export</label>
  <div class="row"><div><select id="f-clip"><option value="8">8-second video</option><option value="12" selected>12-second video</option><option value="20">20-second video</option></select></div></div>
  <div class="btns"><button id="exPng">Save image (PNG)</button><button class="ghost" id="exVid">Record video</button></div>
  <div class="note">Chrome will ask to share this tab. Pick it and click Share. The file saves to your Downloads folder at full size for the layout above.</div>
  <label>Browser Source URL</label>
  <textarea id="url" readonly></textarea>
  <div class="btns"><button id="copy">Copy URL</button></div>
  <div class="note" id="sizeNote"></div>
</aside>

/* ---------------- animated icons (original 605 artwork, brand colors) ---------------- */
const COL = {gold:'#E8B723',amber:'#FFB703',cream:'#F5F1E8',steel:'#9DAAB8',slate:'#6E7884',storm:'#4E5661',storm2:'#727D89',rain:'#7DB9E8',ice:'#BFE6FF'};
const CLOUD = 'M30,62 L78,62 C90,62 98,54 98,44 C98,34 90,26 80,26 C77,14 66,6 54,6 C40,6 29,16 27,29 C16,30 8,38 8,46 C8,55 17,62 30,62 Z';
let uid = 0;
const cloud = (x,y,s,fill,cls='bob',extra='') => `<g transform="translate(${x} ${y}) scale(${s})"><g class="${cls}"><path d="${CLOUD}" fill="${fill}" stroke="rgba(0,0,0,.25)" stroke-width="1.5" ${extra}/></g></g>`;
function sun(x,y,r){
  let rays=''; for(let i=0;i<8;i++){ const a=i*Math.PI/4, r1=r*1.32, r2=r*1.62;
    rays+=`<line x1="${(Math.cos(a)*r1).toFixed(1)}" y1="${(Math.sin(a)*r1).toFixed(1)}" x2="${(Math.cos(a)*r2).toFixed(1)}" y2="${(Math.sin(a)*r2).toFixed(1)}" stroke="${COL.gold}" stroke-width="${(r*.17).toFixed(1)}" stroke-linecap="round"/>`; }
  return `<g transform="translate(${x} ${y})"><circle class="glow" r="${r*1.12}" fill="${COL.amber}" opacity=".18"/><g class="spin">${rays}</g><circle r="${r}" fill="${COL.gold}"/><circle r="${r*.7}" fill="${COL.amber}" opacity=".45"/></g>`;
}
function moon(x,y,r,stars=true){
  const id='m'+(uid++);
  let st=''; if(stars){ [[-r*1.5,-r*.8,5,0],[r*1.25,-r*1.05,4,.9],[r*1.5,r*.55,3.5,1.7],[-r*1.2,r*.9,3,.5]].forEach(([sx,sy,ss,dl])=>{
    st+=`<g transform="translate(${sx.toFixed(1)} ${sy.toFixed(1)})"><path class="tw" style="animation-delay:${dl}s" d="M0,-${ss*2} L${ss*.5},-${ss*.5} L${ss*2},0 L${ss*.5},${ss*.5} L0,${ss*2} L-${ss*.5},${ss*.5} L-${ss*2},0 L-${ss*.5},-${ss*.5}Z" fill="${COL.cream}"/></g>`; }); }
  return `<g transform="translate(${x} ${y})"><defs><mask id="${id}"><circle r="${r}" fill="#fff"/><circle cx="${r*.48}" cy="${-r*.32}" r="${r*.82}" fill="#000"/></mask></defs><circle r="${r*1.15}" fill="${COL.cream}" opacity=".07"/><circle r="${r}" fill="${COL.cream}" mask="url(#${id})"/>${st}</g>`;
}
const drops=(xs,y0,col=COL.rain,len=14)=>xs.map((x,i)=>`<line class="drop" style="animation-delay:${(i*0.27%1.05).toFixed(2)}s" x1="${x}" y1="${y0}" x2="${x-4}" y2="${y0+len}" stroke="${col}" stroke-width="5" stroke-linecap="round"/>`).join('');
function flakes(xs,y0,cls='flake',dur){
  return xs.map((x,i)=>{ const d=(i*0.61%3.2).toFixed(2);
    return `<g class="${cls}" style="animation-delay:${cls==='bliz'?(i*0.21%1.3).toFixed(2):d}s"><g transform="translate(${x} ${y0+(i%2)*8})">`+
      [0,60,120].map(a=>`<line x1="0" y1="-7" x2="0" y2="7" stroke="${COL.cream}" stroke-width="3" stroke-linecap="round" transform="rotate(${a})"/>`).join('')+`</g></g>`; }).join('');
}
const pellets=(xs,y0)=>xs.map((x,i)=>`<g class="pellet" style="animation-delay:${(i*0.33%1).toFixed(2)}s"><rect x="${x-4}" y="${y0}" width="8" height="8" rx="2" transform="rotate(45 ${x} ${y0+4})" fill="${COL.ice}"/></g>`).join('');
const bolt=(x,y,s=1)=>`<g transform="translate(${x} ${y}) scale(${s})"><path class="bolt" d="M14,0 L0,30 L12,30 L4,56 L30,20 L17,20 L26,0 Z" fill="${COL.amber}" stroke="${COL.gold}" stroke-width="2" stroke-linejoin="round"/></g>`;
const gusts=(rows)=>rows.map(([y,x1,x2,d],i)=>`<path d="M${x1},${y} C${x1+40},${y-10} ${x2-40},${y+10} ${x2},${y} q14,-2 12,-14" fill="none" stroke="${COL.cream}" stroke-width="6" stroke-linecap="round" opacity=".22"/><path class="gust" style="animation-delay:${d}s" d="M${x1},${y} C${x1+40},${y-10} ${x2-40},${y+10} ${x2},${y} q14,-2 12,-14" fill="none" stroke="${COL.cream}" stroke-width="6" stroke-linecap="round"/>`).join('');
const fogLines=(ys,col=COL.steel)=>ys.map(([y,x1,x2],i)=>`<line class="fogl" style="animation-delay:${-i*1.3}s" x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="${col}" stroke-width="9" stroke-linecap="round" opacity=".85"/>`).join('');
const bands=(ys,col,op)=>ys.map(([y,x1,x2],i)=>`<path class="haze" style="animation-delay:${-i*1.7}s" d="M${x1},${y} q20,-10 40,0 t40,0 t40,0 t40,0" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round" opacity="${op}"/>`).join('');

/* ---------------- NWS icon code → animated icon key ---------------- */
const RANK = {tornado:100,hurricane:96,tropical_storm:95,blizzard:92,tsra:88,tsra_sct:86,tsra_hi:85,fzra:82,rain_fzra:81,snow_fzra:80,
  snow_sleet:78,sleet:77,rain_sleet:76,rain_snow:75,snow:74,rain:62,rain_showers:60,rain_showers_hi:58,fog:44,smoke:43,dust:42,haze:41,
  hot:40,cold:39,wind_ovc:34,wind_bkn:33,wind_sct:32,wind_few:31,wind_skc:30,ovc:20,bkn:15,sct:12,few:5,skc:1};
function codeToKey(code,isDay){
  const dn=isDay?'day':'night';
  switch(code){
    case 'skc': case 'few': return 'clear-'+dn;
    case 'sct': return 'partly-cloudy-'+dn;
    case 'bkn': return 'mostly-cloudy-'+dn;
    case 'ovc': return 'cloudy';
    case 'wind_skc': case 'wind_few': case 'wind_sct': case 'wind_bkn': case 'wind_ovc': return 'windy';
    case 'snow': return 'snow';
    case 'blizzard': return 'blizzard';
    case 'rain_snow': return 'rain-snow';
    case 'rain_sleet': case 'snow_sleet': case 'sleet': return 'sleet';
    case 'fzra': case 'rain_fzra': case 'snow_fzra': return 'freezing-rain';
    case 'rain': return 'rain';
    case 'rain_showers': case 'rain_showers_hi': return 'showers-'+dn;
    case 'tsra': return 'thunderstorms';
    case 'tsra_sct': case 'tsra_hi': return 'scattered-tstorms-'+dn;
    case 'tornado': return 'tornado';
    case 'hurricane': case 'tropical_storm': return 'tropical';
    case 'dust': case 'smoke': case 'haze': case 'fog': case 'hot': case 'cold': return code;
  }
  return null;
}
function textToKey(t,isDay){
  const dn=isDay?'day':'night'; t=(t||'').toLowerCase();
  if(/tornado/.test(t)) return 'tornado';
  if(/blizzard/.test(t)) return 'blizzard';
  if(/thunder|t-storm/.test(t)) return /chance|slight|scattered|isolated/.test(t)?'scattered-tstorms-'+dn:'thunderstorms';
  if(/freezing (rain|drizzle)/.test(t)) return 'freezing-rain';
  if(/sleet|ice pellets/.test(t)) return 'sleet';
  if(/rain.*snow|snow.*rain|wintry mix/.test(t)) return 'rain-snow';
  if(/snow|flurr/.test(t)) return 'snow';
  if(/shower/.test(t)) return 'showers-'+dn;
  if(/rain|drizzle/.test(t)) return 'rain';
  if(/fog/.test(t)) return 'fog';
  if(/smoke/.test(t)) return 'smoke';
  if(/haze/.test(t)) return 'haze';
  if(/dust/.test(t)) return 'dust';
  if(/wind|breezy|blustery/.test(t)) return 'windy';
  if(/mostly cloudy/.test(t)) return 'mostly-cloudy-'+dn;
  if(/partly|mostly sunny|mostly clear/.test(t)) return 'partly-cloudy-'+dn;
  if(/cloudy|overcast/.test(t)) return 'cloudy';
  if(/hot/.test(t)) return 'hot';
  if(/sunny|clear/.test(t)) return 'clear-'+dn;
  return 'cloudy';
}
function refineKey(k,p,isDay){
  const t=((p.shortForecast||'')+' '+(p.detailedForecast||'')).toLowerCase(), sf=(p.shortForecast||'').toLowerCase();
  if(/tstorms|thunderstorms/.test(k) && /snow/.test(sf)) return 'thundersnow';
  if(k==='rain' && /heavy rain|heavy at times|torrential/.test(t)) return 'heavy-rain';
  if(k==='snow' && isDay && /shower/.test(sf)) return 'snow-showers-day';
  if(k==='rain-snow' && isDay && /shower/.test(sf)) return 'mix-showers-day';
  return k;
}
function pickIcon(p){
  if(!p) return 'cloudy';
  try{
    const parts = new URL(p.icon).pathname.split('/');            // /icons/land/day/tsra_sct,40/tsra,60
    const isDay = parts[3] ? parts[3]==='day' : p.isDaytime;
    const codes = parts.slice(4).map(s=>decodeURIComponent(s).split(',')[0]).filter(Boolean);
    codes.sort((a,b)=>(RANK[b]||0)-(RANK[a]||0));
    const k = (codes.length && codeToKey(codes[0],isDay)) || textToKey(p.shortForecast,isDay);
    return refineKey(k,p,isDay);
  }catch(e){ return refineKey(textToKey(p.shortForecast,p.isDaytime),p,p.isDaytime); }
}

/* ---------------- forecast shaping ---------------- */
const DIRS={N:0,NNE:22.5,NE:45,ENE:67.5,E:90,ESE:112.5,SE:135,SSE:157.5,S:180,SSW:202.5,SW:225,WSW:247.5,W:270,WNW:292.5,NW:315,NNW:337.5};
const SEVERE_RX=/\bsevere\b|tornado|large hail|damaging wind|destructive/i;
function groupDays(periods){
  const days=[];
  for(const p of periods){
    const date=p.startTime.slice(0,10);
    if(p.isDaytime){ days.push({date,day:p,night:null}); continue; }
    const last=days[days.length-1];
    if(last && last.date===date && last.day && !last.night) last.night=p;
    else days.push({date,day:null,night:p});
  }
  if(cfg.tonight==='skip' && days.length && !days[0].day) days.shift();
  return days.slice(0,7);
}
function tidy(s){
  s=(s||'').replace(/ And /g,' & ').replace(/Thunderstorms/g,'T-Storms').replace(/ then /gi,' → ');
  return s;
}
function windStr(p){
  if(!p||!p.windSpeed) return '';
  const sp=p.windSpeed.replace(/ to /,'–').replace(/\s*(mph|km\/h)/,'');
  return {dir:p.windDirection||'', deg:DIRS[p.windDirection], sp};
}
const popOf=p=>p&&p.probabilityOfPrecipitation&&p.probabilityOfPrecipitation.value!=null?p.probabilityOfPrecipitation.value:0;
function dayLabel(d,i){
  const [y,m,dd]=d.date.split('-').map(Number); const dt=new Date(y,m-1,dd);
  const wd=dt.toLocaleDateString('en-US',{weekday:cfg.layout==='v'?'short':'short'}).toUpperCase();
  const date=dt.toLocaleDateString('en-US',{month:'short',day:'numeric'}).toUpperCase();
  let name=wd;
  if(i===0){
    const n=((d.day||d.night).name||'').toLowerCase();
    if(!d.day) name = /overnight/.test(n)?'OVERNT':'TONIGHT';
    else { const t=new Date(); const td=`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
      if(/today|this afternoon|this morning/.test(n) || d.date===td) name='TODAY'; }
  }
  return {name,date};
}

/* ---------------- rendering ---------------- */
const dropSVG=(c='#7DB9E8')=>`<svg width="18" height="24" viewBox="0 0 18 24"><path d="M9 1 C9 1 1 11 1 16 a8 8 0 0 0 16 0 C17 11 9 1 9 1Z" fill="${c}"/></svg>`;
const arrowSVG=deg=>`<svg width="22" height="22" viewBox="-11 -11 22 22" style="transform:rotate(${((deg||0)+180)%360}deg)"><path d="M0,-9 L6,6 L0,2 L-6,6Z" fill="#E8B723"/></svg>`;

function shell(){
  document.documentElement.className = (cfg.layout==='v'?'v':'h')+' '+(cfg.bg==='clear'?'clear':'solid');
  if(cfg.layout==='v'){
    const safe=+cfg.safe===1, r=stage.style;
    const v = safe ? {vtop:150,vhh:254,vdays:416,vrow:130,vgap:10,vftr:1398,vl:48,vr:132,vtitle:62}
                   : {vtop:70,vhh:290,vdays:392,vrow:176,vgap:14,vftr:1762,vl:48,vr:48,vtitle:76};

  }
  const logo = cfg.logo ? `<img src="${cfg.logo}" alt="605 Chaser">` : `<img class="mark" src="${LOGO_MARK}" alt=""><span class="wm"><span class="n">605</span><span class="c">CHASER</span></span>`;
  stage.innerHTML =
    (cfg.bg==='clear'?'':`<div class="bg"><i></i><i></i><i></i><b></b><b></b><b></b></div>`)+
    `<div class="hdr"><div class="logo">${logo}</div>
       <div class="htxt"><div class="hrow"><div class="htitle" id="title"></div></div><div class="hloc" id="loc"></div></div>
       <div class="hmeta" id="meta"></div></div>
     <div class="days" id="days"></div>
     <div class="ftr" id="ftr"><div class="tag">TRACKING CHAOS.<em>DELIVERING CLARITY.</em></div>
       <div class="alrt"><div class="lab">⚠ ALERTS</div><div class="win"><div class="run" id="run"></div></div></div>
       <div class="src" id="src">DATA: NATIONAL WEATHER SERVICE</div></div>
     <div class="status" id="status"></div>
     <div class="wipe"><s></s><s></s><s></s></div>`;
  document.getElementById('title').textContent = cfg.title;
  document.getElementById('loc').textContent = cfg.name;
  fit();
}
function renderDays(days,units){
  const deg = '°';
  const el=document.getElementById('days');
  el.innerHTML = days.map((d,i)=>{
    const lab=dayLabel(d,i), main=d.day||d.night;
    const key=pickIcon(main);
    const sev = SEVERE_RX.test((d.day?d.day.detailedForecast:'')+' '+(d.night?d.night.detailedForecast:''));
    const pop=Math.max(popOf(d.day),popOf(d.night));
    const w=windStr(main);
    const hi=d.day?d.day.temperature:null, lo=d.night?d.night.temperature:null;
    const temps=`<div class="c-temps">${hi!=null?`<div class="t hi"><span class="lbl">HI</span>${hi}<sup>${deg}</sup></div>`:''}${lo!=null?`<div class="t lo"><span class="lbl">LO</span>${lo}<sup>${deg}</sup></div>`:''}</div>`;
    const meta=`<div class="c-meta"><span class="m ${pop?'':'dry'}">${dropSVG(pop?'#7DB9E8':'#9DAAB8')}${pop}%</span>${w?`<span class="m">${arrowSVG(w.deg)}${w.dir} ${w.sp}</span>`:''}</div>`;
    const text=`<div class="c-text">${tidy(main.shortForecast)}</div>`;
    const head=`<div class="c-head"><div class="c-day">${lab.name}</div><div class="c-date">${lab.date}</div></div>`;
    const icon=`<div class="c-icon">${iconHTML(key)}${sev?'<div class="badge">SEVERE RISK</div>':''}</div>`;
    const cls=`card${i===0?' today':''}${sev?' severe':''}`;
    return cfg.layout==='v'
      ? `<div class="${cls}" style="--i:${i}" data-icon="${key}">${head}${icon}<div class="c-mid">${text}${meta}</div>${temps}</div>`
      : `<div class="${cls}" style="--i:${i}" data-icon="${key}">${head}${icon}${text}${temps}${meta}</div>`;
  }).join('');
}
function renderMeta(m){
  const t = m.updated ? new Date(m.updated).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:m.tz||undefined,timeZoneName:'short'}) : '';
  document.getElementById('meta').innerHTML = cfg.layout==='v'
    ? `<span>NWS <strong>${m.office||''}</strong></span><span>ISSUED <strong>${t}</strong></span>`
    : `<div>NWS <strong>${m.office||''}</strong></div><div>ISSUED <strong>${t}</strong></div>`;
  document.getElementById('src').textContent = `DATA: NATIONAL WEATHER SERVICE ${m.office||''}`;
}
function renderAlerts(list,tz){
  const ftr=document.getElementById('ftr'), run=document.getElementById('run');
  if(!+cfg.alerts || !list || !list.length){ ftr.classList.remove('has-alerts'); run.innerHTML=''; return; }
  const seen=new Set();
  const items=list.filter(a=>{ const k=a.event+a.ends; if(seen.has(k)) return false; seen.add(k); return true; })
    .map(a=>{ const e=a.ends?new Date(a.ends).toLocaleString('en-US',{weekday:'short',hour:'numeric',minute:'2-digit',timeZone:tz||undefined}):'';
      return `${a.event}${e?` <span>until ${e}</span>`:''}`; });
  const txt=items.join('&nbsp;&nbsp;&nbsp;•&nbsp;&nbsp;&nbsp;');
  ftr.classList.add('has-alerts');
  run.className='run'; run.innerHTML=txt;
  (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>requestAnimationFrame(()=>{
    const win=run.parentNode;
    if(run.scrollWidth>win.clientWidth){
      run.innerHTML=txt+'&nbsp;&nbsp;&nbsp;•&nbsp;&nbsp;&nbsp;'+txt+'&nbsp;&nbsp;&nbsp;•&nbsp;&nbsp;&nbsp;';
      run.style.setProperty('--dur',Math.max(12,run.scrollWidth/2/90)+'s'); run.classList.add('scroll');
    }
  }));
}
function status(msg){ const s=document.getElementById('status'); if(!s) return; s.textContent=msg||''; s.classList.toggle('on',!!msg); }
function playIntro(){ stage.classList.remove('play'); void stage.offsetWidth; stage.classList.add('play'); }
let tiling=false;
function fit(){
  if(tiling) return;
  const W=cfg.layout==='v'?1080:1920, H=cfg.layout==='v'?1920:1080;
  const vw=viewport.clientWidth, vh=viewport.clientHeight;
  const s=Math.min(vw/W,vh/H);
  stage.style.transform=`translate(${(vw-W*s)/2}px,${(vh-H*s)/2}px) scale(${s})`;
}
addEventListener('resize',fit);

/* ---------------- data ---------------- */
async function getJSON(url){
  let last;
  for(let a=0;a<3;a++){
    try{ const r=await fetch(url,{headers:{Accept:'application/geo+json'},cache:'no-store'});
      if(r.ok) return await r.json(); last=new Error('HTTP '+r.status); if(r.status===404) break; }
    catch(e){ last=e; }
    await new Promise(r=>setTimeout(r,2500*(a+1)));
  }
  throw last;
}
async function loadNWS(){
  const lat=(+cfg.lat).toFixed(4), lon=(+cfg.lon).toFixed(4), pk='pt:'+lat+','+lon;
  let pt=store.get(pk);
  if(!pt || Date.now()-pt.t>7*864e5){
    const j=await getJSON(`https://api.weather.gov/points/${lat},${lon}`);
    const rl=j.properties.relativeLocation&&j.properties.relativeLocation.properties;
    pt={t:Date.now(),forecast:j.properties.forecast,office:j.properties.gridId,tz:j.properties.timeZone,city:rl&&rl.city,state:rl&&rl.state};
    store.set(pk,pt);
  }
  let fc;
  try{ fc=await getJSON(pt.forecast+(cfg.units==='si'?'?units=si':'')); }
  catch(e){ store.del(pk); throw e; }
  let alerts=[];
  if(+cfg.alerts){
    try{ const a=await getJSON(`https://api.weather.gov/alerts/active?point=${lat},${lon}`);
      alerts=(a.features||[]).map(f=>({event:f.properties.event,ends:f.properties.ends||f.properties.expires,severity:f.properties.severity}))
        .sort((x,y)=>({Extreme:0,Severe:1,Moderate:2,Minor:3}[x.severity]??4)-({Extreme:0,Severe:1,Moderate:2,Minor:3}[y.severity]??4)); }
    catch(e){}
  }
  return {periods:fc.properties.periods, updated:fc.properties.updateTime||fc.properties.generatedAt, office:pt.office, tz:pt.tz, alerts};
}
function demoData(){
  const set=[['tsra_sct,40/tsra,60','Chance T-Storms','Showers and thunderstorms likely. Some of the storms could be severe, with large hail and damaging winds.',78,40,'S','15 to 25 mph'],
    ['tsra,70','Thunderstorms Likely','Thunderstorms likely, mainly after 1am.',61,70,'S','10 to 15 mph'],
    ['wind_sct','Breezy & Partly Sunny','Breezy, with a northwest wind 20 to 30 mph.',66,10,'NW','20 to 30 mph'],
    ['few','Clear','Clear, with a low around 41.',41,0,'NW','5 mph'],
    ['skc','Sunny','Sunny, with a high near 63.',63,0,'W','5 to 10 mph'],
    ['sct','Partly Cloudy','Partly cloudy.',44,0,'SW','5 mph'],
    ['bkn','Mostly Cloudy','Mostly cloudy.',58,10,'SE','10 mph'],
    ['rain_showers,30','Chance Rain Showers','A chance of rain showers.',47,30,'E','10 mph'],
    ['rain,60','Rain Likely','Rain likely.',52,60,'NE','10 to 15 mph'],
    ['rain_snow,50','Rain & Snow','Rain and snow likely.',33,50,'N','15 mph'],
    ['snow,40','Chance Snow','A chance of snow.',36,40,'N','10 to 15 mph'],
    ['fzra,30','Freezing Rain Possible','Freezing rain possible.',27,30,'NE','5 mph'],
    ['fog','Patchy Fog','Patchy fog before 9am.',45,0,'S','5 mph'],
    ['few','Mostly Clear','Mostly clear.',30,0,'S','5 mph']];
  const now=new Date(); const periods=[];
  const pad=n=>String(n).padStart(2,'0');
  for(let i=0;i<14;i++){
    const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()+Math.floor(i/2));
    const ds=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    const day=i%2===0, s=set[i];
    periods.push({name:i===0?'Today':(day?d.toLocaleDateString('en-US',{weekday:'long'}):'Night'),isDaytime:day,
      startTime:`${ds}T${day?'06':'18'}:00:00-05:00`,temperature:s[3],windSpeed:s[6],windDirection:s[5],
      icon:`https://api.weather.gov/icons/land/${day?'day':'night'}/${s[0]}?size=medium`,shortForecast:s[1],detailedForecast:s[2],
      probabilityOfPrecipitation:{value:s[4]}});
  }
  return {periods,updated:new Date().toISOString(),office:'FSD',tz:'America/Chicago',
    alerts:[{event:'Tornado Watch',ends:new Date(Date.now()+5*36e5).toISOString()},{event:'Wind Advisory',ends:new Date(Date.now()+9*36e5).toISOString()}]};
}
let timer=null, firstPaint=true;
async function refresh(){
  clearTimeout(timer);
  const ck='last:'+(+cfg.lat).toFixed(3)+','+(+cfg.lon).toFixed(3)+':'+cfg.units;
  try{
    const data = +cfg.demo ? demoData() : await loadNWS();
    if(!+cfg.demo) store.set(ck,data);
    draw(data);
    timer=setTimeout(refresh,Math.max(5,+cfg.refresh)*60e3);
  }catch(e){
    console.warn('[605 7-day] fetch failed',e);
    const cached=store.get(ck);
    if(cached && firstPaint) draw(cached);
    else if(firstPaint) status('Waiting for National Weather Service data…');
    timer=setTimeout(refresh,120e3);
  }
}
function draw(data){
  status('');
  renderDays(groupDays(data.periods),cfg.units);
  renderMeta(data);
  renderAlerts(data.alerts,data.tz);
  if(firstPaint){ playIntro(); firstPaint=false; }
}
function gallery(){
  shell();
  ['days','ftr','status'].forEach(id=>{const e=document.getElementById(id); if(e) e.remove();});
  document.querySelector('.hdr').remove();
  const g=document.createElement('div'); g.className='gal';
  g.innerHTML=[...new Set([...ICON_KEYS,...Object.keys(VIDEO)])].map(k=>`<div>${iconHTML(k)}<span>${k}</span></div>`).join('');
  stage.appendChild(g);
}

/* ---------------- setup panel ---------------- */
const ABBR={Alabama:'AL',Alaska:'AK',Arizona:'AZ',Arkansas:'AR',California:'CA',Colorado:'CO',Connecticut:'CT',Delaware:'DE',Florida:'FL',Georgia:'GA',Hawaii:'HI',Idaho:'ID',Illinois:'IL',Indiana:'IN',Iowa:'IA',Kansas:'KS',Kentucky:'KY',Louisiana:'LA',Maine:'ME',Maryland:'MD',Massachusetts:'MA',Michigan:'MI',Minnesota:'MN',Mississippi:'MS',Missouri:'MO',Montana:'MT',Nebraska:'NE',Nevada:'NV','New Hampshire':'NH','New Jersey':'NJ','New Mexico':'NM','New York':'NY','North Carolina':'NC','North Dakota':'ND',Ohio:'OH',Oklahoma:'OK',Oregon:'OR',Pennsylvania:'PA','Rhode Island':'RI','South Carolina':'SC','South Dakota':'SD',Tennessee:'TN',Texas:'TX',Utah:'UT',Vermont:'VT',Virginia:'VA',Washington:'WA','West Virginia':'WV',Wisconsin:'WI',Wyoming:'WY','District of Columbia':'DC','Puerto Rico':'PR'};
const FIELDS=['lat','lon','name','title','layout','bg','safe','units','alerts','tonight','refresh','replay','icons','videodir','iconpack','iconext'];
const $=id=>document.getElementById(id);
function buildURL(){
  const p=new URLSearchParams();
  FIELDS.forEach(k=>{ if(String(cfg[k])!==String(DEFAULTS[k])) p.set(k,cfg[k]); });
  const base=location.href.split('?')[0].split('#')[0];
  const s=p.toString();
  $('url').value = base + (s?'?'+s:'');
  $('sizeNote').innerHTML = cfg.layout==='v'
    ? 'Streamlabs Browser Source size: <b>1080 × 1920</b> (vertical canvas).'
    : 'Streamlabs Browser Source size: <b>1920 × 1080</b> (horizontal canvas).';
  $('sizeNote').innerHTML += '<br>Tick “Refresh browser when scene becomes active” so the intro plays each time you cut to it.';
}
function initPanel(){
  document.body.classList.add('setup');
  FIELDS.forEach(k=>{ $('f-'+k).value=cfg[k]; });
  const apply=()=>{ FIELDS.forEach(k=>{ const v=$('f-'+k).value; cfg[k]= typeof DEFAULTS[k]==='number' ? +v : v; }); start(); };
  $('apply').onclick=apply;
  FIELDS.forEach(k=>$('f-'+k).addEventListener('change',apply));
  $('replay').onclick=playIntro;
  $('exPng').onclick=()=>exportCapture('png');
  $('exVid').onclick=()=>exportCapture('video');
  $('gal').onclick=()=>{ cfg.gallery = +cfg.gallery?0:1; $('gal').textContent=+cfg.gallery?'Back to forecast':'Icon gallery'; start(); };
  $('copy').onclick=()=>{ $('url').select(); try{ navigator.clipboard.writeText($('url').value); }catch(e){ document.execCommand('copy'); } $('copy').textContent='Copied'; setTimeout(()=>$('copy').textContent='Copy URL',1500); };
  const search=async()=>{
    const q=$('q').value.trim(); if(!q) return;
    $('results').innerHTML='<div>Searching…</div>';
    try{
      const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q.split(',')[0])}&count=8&language=en&countryCode=US`);
      const j=await r.json(); const res=(j.results||[]);
      $('results').innerHTML = res.length ? '' : '<div>No matches</div>';
      res.forEach(x=>{ const d=document.createElement('div'); const st=ABBR[x.admin1]||x.admin1||'';
        d.textContent=`${x.name}, ${st}${x.admin2?' · '+x.admin2:''}`;
        d.onclick=()=>{ $('f-lat').value=x.latitude.toFixed(4); $('f-lon').value=x.longitude.toFixed(4); $('f-name').value=`${x.name}, ${st}`; $('results').innerHTML=''; apply(); };
        $('results').appendChild(d); });
    }catch(e){ $('results').innerHTML='<div>Search unavailable — enter latitude/longitude instead.</div>'; }
  };
  $('go').onclick=search; $('q').addEventListener('keydown',e=>{ if(e.key==='Enter') search(); });
}
function start(){
  firstPaint=true; clearTimeout(timer);
  if(+cfg.gallery){ gallery(); if(+cfg.setup) buildURL(); return; }
  shell(); refresh(); if(+cfg.setup) buildURL();
}

/* ---------------- export: PNG still / video clip (Chrome tab capture) ---------------- */
let exporting=false;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const frames=n=>new Promise(r=>{const f=()=>(--n<=0?r():requestAnimationFrame(f));requestAnimationFrame(f);});
function toast(msg,ms){ let t=document.getElementById('toast'); if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t);} t.textContent=msg||''; t.style.display=msg?'block':'none'; if(ms) setTimeout(()=>{ if(t.textContent===msg) t.style.display='none'; },ms); }
function saveBlob(blob,name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000); }
async function exportCapture(kind){
  if(exporting) return;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getDisplayMedia){ toast('Export needs Google Chrome',4000); return; }
  exporting=true;
  const wasSetup=document.body.classList.contains('setup');
  let stream;
  try{ stream=await navigator.mediaDevices.getDisplayMedia({video:{displaySurface:'browser',frameRate:30,cursor:'never'},audio:false,preferCurrentTab:true,selfBrowserSurface:'include',surfaceSwitching:'exclude'}); }
  catch(e){ exporting=false; toast('Export cancelled',2500); return; }
  toast('');
  document.body.classList.remove('setup'); document.body.classList.add('exporting'); fit();
  const v=document.createElement('video'); v.muted=true; v.playsInline=true; v.srcObject=stream; await v.play();
  await sleep(1000); fit(); await sleep(300);
  const W=cfg.layout==='v'?1080:1920, H=cfg.layout==='v'?1920:1080;
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H; const cx=cv.getContext('2d'); cx.imageSmoothingEnabled=true; cx.imageSmoothingQuality='high';
  const k=()=>[v.videoWidth/innerWidth, v.videoHeight/innerHeight];
  const name=`605-7day-${cfg.layout==='v'?'vertical':'horizontal'}-${(cfg.name||'').replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'').toLowerCase()}-${(d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`)(new Date())}`;
  try{
    if(kind==='png'){
      // capture the graphic at 100% size in tiles, so the PNG is full resolution even on a small screen
      const vids=[...stage.querySelectorAll('video')]; vids.forEach(x=>x.pause());
      document.body.classList.add('freeze'); tiling=true;
      const tw=Math.min(innerWidth,W), th=Math.min(innerHeight,H);
      for(let y=0;y<H;y+=th){ for(let x=0;x<W;x+=tw){
        const cw=Math.min(tw,W-x), ch=Math.min(th,H-y);
        stage.style.transform=`translate(${-x}px,${-y}px) scale(1)`;
        await frames(3); await sleep(250);
        const [kx,ky]=k(); cx.drawImage(v,0,0,cw*kx,ch*ky,x,y,cw,ch);
      }}
      tiling=false; document.body.classList.remove('freeze'); vids.forEach(x=>x.play().catch(()=>{})); fit();
      const b=await new Promise(r=>cv.toBlob(r,'image/png')); saveBlob(b,name+'.png');
    } else {
      const mime=['video/mp4;codecs=avc1.640028','video/mp4','video/webm;codecs=vp9','video/webm'].find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m));
      const draw=()=>{ const r=stage.getBoundingClientRect(), [kx,ky]=k(); cx.drawImage(v,r.left*kx,r.top*ky,r.width*kx,r.height*ky,0,0,W,H); };
      const rec=new MediaRecorder(cv.captureStream(30),{mimeType:mime,videoBitsPerSecond:16e6}); const chunks=[];
      rec.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
      const done=new Promise(r=>rec.onstop=r);
      playIntro(); draw(); rec.start(250);
      const secs=Math.max(4,+document.getElementById('f-clip')?.value||12), t0=performance.now();
      await new Promise(res=>{ const loop=()=>{ draw(); if((performance.now()-t0)/1000>=secs) return res(); requestAnimationFrame(loop); }; loop(); });
      rec.stop(); await done;
      saveBlob(new Blob(chunks,{type:mime}), name+(mime.includes('mp4')?'.mp4':'.webm'));
    }
  } catch(e){ console.warn('[605 export]',e); }
  finally{
    tiling=false; stream.getTracks().forEach(t=>t.stop());
    document.body.classList.remove('exporting','freeze'); if(wasSetup) document.body.classList.add('setup'); fit();
    exporting=false; toast(kind==='png'?'Image saved to Downloads':'Video saved to Downloads',3500);
  }
}
/* ---------------- boot ---------------- */
if(+cfg.setup) initPanel();
start();
let replayTimer=null;
if(+cfg.replay>0) replayTimer=setInterval(playIntro,+cfg.replay*1000);
addEventListener('obsSourceVisibleChanged',e=>{ if(e.detail&&e.detail.visible) playIntro(); });
