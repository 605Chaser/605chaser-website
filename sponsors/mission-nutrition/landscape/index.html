<title>Forecast brought to you by Mission Nutrition</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&display=swap');
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1220;font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif}
body.transparent{background:transparent}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;}
.bg{position:absolute;inset:0;background:radial-gradient(ellipse at 30% 50%,#1b2a44 0%,#0b1220 65%);}
.transparent .bg,.transparent .sweep,.transparent .grid{display:none}
.grid{position:absolute;inset:0;opacity:.18;background-image:linear-gradient(#3b5b8a 1px,transparent 1px),linear-gradient(90deg,#3b5b8a 1px,transparent 1px);background-size:80px 80px;mask-image:radial-gradient(ellipse at 30% 50%,#000 20%,transparent 70%);-webkit-mask-image:radial-gradient(ellipse at 30% 50%,#000 20%,transparent 70%)}
.sweep{position:absolute;left:575px;top:540px;width:1400px;height:1400px;margin:-700px 0 0 -700px;border-radius:50%;
 background:conic-gradient(from 0deg,rgba(184,210,66,.28),rgba(184,210,66,0) 60deg,transparent 360deg);animation:spin 4s linear infinite;opacity:0}
@keyframes spin{to{transform:rotate(360deg)}}
.card{position:absolute;left:300px;top:190px;width:550px;height:700px}
.plate{position:absolute;inset:-40px -60px;background:#fff;border-radius:28px;box-shadow:0 30px 80px rgba(0,0,0,.45);transform:scale(0);}
.logo{position:absolute;left:0;top:40px;width:550px;height:620px}
.logo img{position:absolute;left:0;top:0;width:550px;height:620px}
#gray{clip-path:inset(100% 0 0 0)}
#green{clip-path:polygon(0 0,0 0,0 0,0 0)}
.shine{position:absolute;left:0;top:40px;width:550px;height:620px;overflow:hidden;pointer-events:none;
 -webkit-mask:url(#m) ;}
.text{position:absolute;left:1000px;top:270px;width:820px;color:#fff}
.kicker{font-weight:500;font-size:46px;letter-spacing:6px;text-transform:uppercase;color:#b8d242;opacity:0;transform:translateY(20px)}
.name{font-weight:800;font-size:150px;line-height:.9;margin-top:14px;text-transform:uppercase}
.name span{display:block;clip-path:inset(0 100% 0 0)}
.name .n2{color:#b8d242}
.bar{height:8px;width:0;background:#b8d242;margin:34px 0 26px;border-radius:4px}
.addr{font-weight:500;font-size:44px;color:#d7dde8;opacity:0}
.cta{font-weight:700;font-size:40px;letter-spacing:3px;text-transform:uppercase;color:#fff;margin-top:10px;opacity:0}
.fb{display:flex;align-items:center;gap:14px;font-weight:500;font-size:38px;color:#d7dde8;margin-top:22px;opacity:0}
.ig{margin-top:12px}
.transparent .text{text-shadow:0 3px 12px rgba(0,0,0,.8)}
.tag{position:absolute;left:60px;bottom:50px;color:#8fa3c4;font-size:30px;letter-spacing:4px;text-transform:uppercase;opacity:0}
</style></head>

<script>
/* URL options: ?transparent=1 (OBS overlay, no background)  ?loop=1 (repeat)  ?hold=1 (stay on final frame) */
const Q=new URLSearchParams(location.search);
if(Q.get('transparent')==='1')document.body.classList.add('transparent');
const stage=document.getElementById('stage');
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform=`translate(-50%,-50%) scale(${s})`}
addEventListener('resize',fit);fit();
const $=id=>document.getElementById(id);
const clamp=x=>Math.max(0,Math.min(1,x));
const ease=t=>1-Math.pow(1-t,3);
const back=t=>{const c=1.7;t=t-1;return 1+t*t*((c+1)*t+c)};
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const DUR=8.0, OUT=7.2;
function render(t){
 const out=ease(seg(t,OUT,DUR));           // exit
 $('sweep').style.opacity=(0.9*ease(seg(t,0,0.8))*(1-out)).toFixed(3);
 $('plate').style.transform=`scale(${back(seg(t,0.2,0.9))*(1-out)})`;
 // gray M rises in from bottom
 const gy=ease(seg(t,0.6,1.5));
 $('gray').style.clipPath=`inset(${(1-gy)*100}% 0 0 0)`;
 $('gray').style.transform=`translateY(${(1-gy)*40}px)`;
 // green N slashes in along its diagonal (top-left to bottom-right)
 const gn=ease(seg(t,1.3,2.1))*130;
 $('green').style.clipPath=`polygon(0 0,${gn}% 0,${gn-60}% 100%,0 100%)`;
 // little pop when complete
 const pop=seg(t,2.1,2.5);const ps=1+Math.sin(pop*Math.PI)*0.04;
 $('card').style.transform=`scale(${ps}) translateX(${-out*120}px)`;
 $('card').style.opacity=1-out;
 $('kicker').style.opacity=ease(seg(t,2.2,2.8))*(1-out);
 $('kicker').style.transform=`translateY(${(1-ease(seg(t,2.2,2.8)))*20}px)`;
 $('n1').style.clipPath=`inset(0 ${(1-ease(seg(t,2.6,3.2)))*100}% 0 0)`;
 $('n2').style.clipPath=`inset(0 ${(1-ease(seg(t,2.9,3.5)))*100}% 0 0)`;
 $('bar').style.width=(ease(seg(t,3.4,4.1))*520)+'px';
 $('addr').style.opacity=ease(seg(t,3.9,4.5));
 $('cta').style.opacity=ease(seg(t,4.3,4.9));
 $('fb').style.opacity=ease(seg(t,4.7,5.3));
 $('ig').style.opacity=ease(seg(t,5.0,5.6));
 $('tag').style.opacity=ease(seg(t,0.5,1.2))*(1-out);
 document.querySelector('.text').style.opacity=1-out;
 document.querySelector('.text').style.transform=`translateX(${out*120}px)`;
}
window.__render=render; window.__DUR=DUR;
if(!Q.has('capture')){
 let t0=performance.now();
 const hold=Q.get('hold')==='1', loop=Q.get('loop')==='1';
 (function tick(now){let t=(now-t0)/1000;
  if(hold&&t>OUT)t=OUT-0.001;
  if(t>DUR){ if(loop){t0=now+600;t=0;} else t=DUR; }
  render(t);requestAnimationFrame(tick)})(t0);
}
</script></body></html>
